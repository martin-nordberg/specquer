name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Bun version pinned in mise.toml
      - uses: jdx/mise-action@v4

      - run: bun install --frozen-lockfile

      - uses: actions/configure-pages@v6

      - run: bun run --filter @specquer/documentation docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: documentation/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
